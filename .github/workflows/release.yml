name: Build and Release Executables

on:
  release:
    types: [created]

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pandas openpyxl
      - name: Build executable
        run: pyinstaller --onefile --windowed --hidden-import openpyxl kbart_gui.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/kbart_gui.exe

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyinstaller pandas openpyxl
      - name: Build executable
        run: pyinstaller --onefile --hidden-import openpyxl kbart_gui.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/kbart_gui

  release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_linux]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: ./windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-executable
          path: ./linux

      - name: Upload Release Assets
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./windows/kbart_gui.exe#kbart_gui-windows.exe \
            ./linux/kbart_gui#kbart_gui-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
